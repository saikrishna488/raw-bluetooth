name: Build Intel macOS installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gui/Info.plist'
      - 'packaging/**'
      - '.github/workflows/macos-release.yml'
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  installer:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Test backend
        run: |
          python -m unittest discover
          python -m pip check
          xcrun swiftc -parse-as-library gui/PointerServer.swift gui/KeyboardOutput.swift gui/test_pointer_bounds.swift -o /tmp/pointer-tests -framework AppKit
          /tmp/pointer-tests
      - name: Build and verify installer
        run: |
          python packaging/build_release.py
          python packaging/verify_release.py dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Raw-Bluetooth-macOS-Intel
          path: dist/*
          if-no-files-found: error
      - name: Publish community preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import plistlib; print(plistlib.load(open("gui/Info.plist", "rb"))["CFBundleShortVersionString"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'This version already has a release. Bump the app version before publishing another installer.'
            exit 1
          fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Raw Bluetooth $VERSION — Intel macOS preview" --prerelease --notes-file packaging/RELEASE_NOTES.md
